# Playground: a railway dataset behind sparql-guard, with a query UI to switch between roles.
#
#   docker compose up --build
#   open http://localhost:8095        query UI (pick a role, write queries)
#        http://localhost:8095/sparql the guarded SPARQL endpoint
#        http://localhost:7879        the unguarded store, for comparison
#
# Change the host ports with SG_UI_PORT and SG_STORE_PORT. Reset the data with
# `docker compose down -v` (the loader only adds triples to the existing database).
#
# This setup trusts the x-forwarded-user / x-forwarded-groups headers so you can try any
# identity from the UI. Never expose a configuration like this outside your machine.

services:
  # Loads the example data into a fresh Oxigraph database, then exits.
  store-load:
    image: ghcr.io/oxigraph/oxigraph:0.5.9
    command: ["load", "--location", "/db", "--file", "/seed/data.trig"]
    volumes:
      - store-db:/db
      - ./examples/railway/data.trig:/seed/data.trig:ro

  store:
    image: ghcr.io/oxigraph/oxigraph:0.5.9
    # No --union-default-graph: with it, Oxigraph ignores FROM clauses, which sparql-guard
    # relies on for graph-level access control.
    command: ["serve-read-only", "--location", "/db", "--bind", "0.0.0.0:7878"]
    volumes:
      - store-db:/db
    ports:
      - "${SG_STORE_PORT:-7879}:7878"
    depends_on:
      store-load:
        condition: service_completed_successfully

  guard:
    build: .
    environment:
      SPARQL_GUARD_CONFIG: /config/sparql-guard.json
    volumes:
      - ./examples/railway:/config:ro
    depends_on:
      - store

  # Serves the query UI and forwards /sparql to the guard, so the browser talks to one origin.
  ui:
    image: nginx:1.27-alpine
    ports:
      - "${SG_UI_PORT:-8095}:80"
    volumes:
      - ./examples/railway/ui:/usr/share/nginx/html:ro
      - ./examples/railway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - guard

volumes:
  store-db:
