server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # The guarded endpoint (and /sparql/explain) on the same origin as the UI.
  location /sparql {
    proxy_pass http://guard:8080;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
}
